[pytest]
testpaths = suites
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    smoke: Quick sanity checks for live deployment verification
    security: Domain isolation, realm denial, and session security tests
    dashboards: Core role dashboard rendering tests
    modules: Read-only deep module smoke tests
