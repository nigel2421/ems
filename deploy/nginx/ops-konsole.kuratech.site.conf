# /etc/nginx/sites-available/ops-konsole.kuratech.site.conf
# Dedicated Operations Console Domain Configuration for Kuratech EMS

server {
    listen 80;
    listen [::]:80;
    server_name ops-konsole.kuratech.site;

    # Certbot ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops-konsole.kuratech.site;

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/ops-konsole.kuratech.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops-konsole.kuratech.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root Directory for Frontend Build
    root /var/www/ems/dist;
    index admin.html;

    # Anti-Crawler & Indexing Defense
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Reverse proxy for EMS backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # CRITICAL: Preserve ops-konsole host header so backend recognizes admin realm
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Static Assets Cache
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Routing: Fallback to admin.html for the Operations Console
    location / {
        try_files $uri $uri/ /admin.html;
    }
}
