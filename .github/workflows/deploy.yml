name: Deploy Kuratech to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuratech-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload site to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: dist/*
          target: ${{ secrets.VPS_TARGET }}
          strip_components: 1

      - name: Upload backend to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: "server.mjs,server/**,src/utils/productionReadinessGate.js,package.json,deploy/**"
          target: "/var/www/ems"

      - name: Deploy backend and restart PM2 on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"
            [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc"
            [ -s "$HOME/.profile" ] && . "$HOME/.profile"

            mkdir -p /var/www/ems/dist
            printf '{\n  "user": "%s",\n  "pm2": "%s",\n  "node": "%s"\n}\n' \
              "$USER" "$(command -v pm2 || echo 'none')" "$(command -v node || echo 'none')" > /var/www/ems/dist/deploy-diag.json

            cd /var/www/ems
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete all || true
              pm2 start deploy/ecosystem.config.cjs
              pm2 save || true
            elif [ -x "/usr/local/bin/pm2" ]; then
              /usr/local/bin/pm2 delete all || true
              /usr/local/bin/pm2 start deploy/ecosystem.config.cjs
              /usr/local/bin/pm2 save || true
            fi
