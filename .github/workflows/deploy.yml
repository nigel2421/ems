name: Deploy Kuratech to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuratech-vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload site to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: dist/*
          target: ${{ secrets.VPS_TARGET }}
          strip_components: 1

      - name: Upload backend to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          source: "server.mjs,server/**,src/utils/productionReadinessGate.js,package.json"
          target: "/var/www/kutatech-api"
          strip_components: 0

      - name: Restart backend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          script: |
            pkill -u "$USER" -f "server.mjs" || true
            sleep 1
            cd /var/www/kutatech-api
            nohup /usr/bin/node server.mjs > server.log 2>&1 &
            sleep 2
            cat << EOF > ${{ secrets.VPS_TARGET }}/deploy-diag.json
            {
              "log": $(tail -n 20 server.log 2>&1 | jq -R -s -c 'split("\n")' 2>/dev/null || echo '[]'),
              "pid_5000": "$(ss -lptn 'sport = :5000' 2>&1 || netstat -nlp 2>&1 | grep 5000 || echo 'none')",
              "node_ps": "$(ps -eo pid,user,args | grep '[n]ode' | tr '\n' '|')"
            }
            EOF
