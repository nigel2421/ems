name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Rolldown (Vite 8) requires ^20.19.0 or >=22.12.0
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm optional-deps bug can skip platform bindings on CI (npm/cli#4828)
      - name: Ensure Rolldown Linux binding
        run: npm install --no-save @rolldown/binding-linux-x64-gnu@1.2.6

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
